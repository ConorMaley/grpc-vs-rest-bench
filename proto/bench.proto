syntax = "proto3";

package bench;

option csharp_namespace = "Bench.Proto";

enum Status {
  STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  PAID = 2;
  SHIPPED = 3;
  CANCELLED = 4;
}

message Customer {
  int64 id = 1;
  string name = 2;
  string email = 3;
  string country = 4;
}

message LineItem {
  string sku = 1;
  int32 quantity = 2;
  double unit_price = 3;
  repeated string tags = 4;
}

message Order {
  int64 id = 1;
  Customer customer = 2;
  int64 created_at_ms = 3;
  Status status = 4;
  double total = 5;
  repeated LineItem items = 6;
}

message EchoMessage { string message = 1; }
message GetOrderRequest { int64 id = 1; int32 items = 2; }
message ListOrdersRequest { int32 count = 1; int32 items = 2; }
message OrderList { repeated Order orders = 1; }
message CreateOrderAck { int64 id = 1; int32 item_count = 2; }

service Benchmark {
  rpc Echo(EchoMessage) returns (EchoMessage);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (OrderList);
  rpc CreateOrder(Order) returns (CreateOrderAck);
}
